upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # The API allows five attachments of 5 MB each, so a full request can reach
    # 25 MB. Kept above that deliberately: an over-limit upload should be turned
    # away by the application, which explains why, rather than by the proxy with
    # an HTML error page the client cannot read.
    client_max_body_size 30M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded attachments and product photography, straight off the volume.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
    }

    # Django's own static files, for the admin and the API browser.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
