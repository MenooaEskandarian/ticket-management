services:
  db:
    image: postgres:17-alpine
    container_name: golgift_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: golgift_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-before-any-real-deployment-0123456789}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Bind-mounted rather than a named volume so the placeholder email and SMS
      # records land in the working copy, where they can actually be read.
      - ./backend/var:/app/var
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: golgift_frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: golgift_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_files:
  media_files:
